name: gkd-speedup
on:
  workflow_dispatch:
  push:
    branches: [gkd-speedup]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew :gkd-app:jvmTest --tests 'li.gkd.app.rule.RuleQueryQueueTest'
      - run: ./gradlew :gkd-app:testAndroidHostTest --tests 'li.gkd.app.a11y.A11yEventQueueTest'
      - run: ./gradlew :gkd-android:assembleGkdRelease
      - uses: actions/upload-artifact@v7
        with:
          name: gkd-speedup
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            gkd-app/build/test-results/
            gkd-app/build/reports/tests/
